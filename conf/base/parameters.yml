# =============================================================================
# Binance API Configuration
# =============================================================================
binance:
  # Trading pair symbol
  symbol: "BTCUSDT"
  # Kline interval: 1h for hourly data
  interval: "1h"
  # Number of years of historical data to fetch
  years_of_data: 2

# =============================================================================
# Prophet Model Configuration
# =============================================================================
prophet:
  # Column to use as target variable for forecasting
  price_column: "close"

  # Seasonality mode: 'additive' or 'multiplicative'
  seasonality_mode: "additive"

  # Seasonality components
  yearly_seasonality: true
  weekly_seasonality: true
  daily_seasonality: true  # Relevant for hourly data (intraday patterns)

  # Changepoint prior scale: higher = more flexible trend
  changepoint_prior_scale: 0.05

  # Seasonality prior scale: higher = more flexible seasonality
  seasonality_prior_scale: 10.0

  # Proportion of data used for changepoint detection
  changepoint_range: 0.75  # Keep recent data outside changepoint window

  # Whether to add OHLCV columns as regressors
  add_regressors: true

  # Whether to add moving averages for regressors (used for future predictions)
  add_moving_averages: true

  # Moving average window size (in periods — 24 = 1 day of hourly data)
  ma_window: 24

  # Number of periods to lag OHLCV regressors (1 period = 1 hour with hourly data)
  lag_days: 1

  # Columns to use as lagged regressors (excluding price_column, which equals y)
  # OHLCV options : "open", "high", "low", "volume"
  # External      : "fear_greed_index"  (daily index — forward-filled to hourly rows)
  regressor_columns:
    - "volume"

  # Test set size in days for model evaluation (7 days = 168 hourly rows)
  test_size_days: 7

# =============================================================================
# Hyperparameter Tuning (Optuna)
# =============================================================================
tuning:
  # Number of Optuna trials (reduced — hourly dataset is ~24x larger, each trial is slower)
  n_trials: 15

  # Metric to minimise: "rmse", "mae", or "mape"
  metric: "rmse"

  # Prophet cross-validation windows (in hours for hourly data)
  cv_initial: "2160 hours"  # 90 days — minimum training window per fold
  cv_period: "168 hours"    # 1 week spacing between cutoff dates
  cv_horizon: "168 hours"   # 1 week forecast horizon evaluated at each cutoff

# =============================================================================
# Forecast Configuration
# =============================================================================
forecast:
  # Number of days to forecast into the future (7 days = 168 hourly predictions)
  days_ahead: 7

  # Strategy to estimate future regressor values
  # 'ma'         → moving average of last ma_window periods (recommended)
  # 'last_value' → repeat last known value
  # 'trend'      → project linear trend of last ma_window periods
  regressor_strategy: "ma"
